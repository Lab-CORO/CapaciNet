# path to the checkpoint file containing the model
# devices: "cpu"
model_path: "/home/ros2_ws/src/capacitynet/config/old_cbe/RM_model.pytorch"
# Encodage de l'entrée du réseau. Doit matcher le transformer `raw` d'entraînement.
#   true  (défaut) -> min-max [-1,1]  (transform Normalize, ex. RM_model_cbr)
#   false          -> occupation brute [0,1]  (transform Identity)
normalize_input: true
# model_path: "/home/ros2_ws/src/capacitynet/config/cbe_synth/best_checkpoint.pytorch"
# model_path: "/home/ros2_ws/src/capacitynet/config/grb_trt/best_checkpoint.pytorch"
# optional TensorRT engine (generated by scripts/export_to_trt.py).
# if the file does not exist the node falls back to PyTorch automatically.
# trt_engine_path: "/home/ros2_ws/src/capacitynet/config/unet3d.trt"
# INT8 engine (faster, ~150ms) — run scripts/calibrate_int8.py first, then swap the line above:
trt_engine_path: "/home/ros2_ws/src/capacitynet/config/old_cbe/unet3d_int8.trt"
# model configuration
model:
  # model class, e.g. UNet3D, ResidualUNet3D
  name: UNet3D
  # number of input channels to the model
  in_channels: 1
  # number of output channels
  out_channels: 1
  # determines the order of operators in a single layer (bcr - BatchNorm+Conv3d+ReLU)
  layer_order: cbr
  # number of features at each level of the U-Net
  f_maps: [16, 32, 64, 128, 256]
  # number of groups in the groupnorm
  num_groups: 8
  # if True applies the final normalization layer (sigmoid or softmax), otherwise the networks returns the output from the final convolution layer; use False for regression problems, e.g. de-noising
  is_segmentation: true
predictor:
  # standard in memory predictor
  name: 'StandardPredictor'
  # save_segmentation: true
  # compute performance scores
  # performance_metric: mean_iou
  # internal path to the ground truth in the H5
  # gt_internal_path: label
# specify the test datasets
loaders:
  # batch dimension; if number of GPUs is N > 1, then a batch_size of N * batch_size will automatically be taken for DataParallel
  batch_size: 1
  # path to the raw data within the H5
  raw_internal_path: raw
  # how many subprocesses to use for data loading
  num_workers: 1
  test:
    # paths to the test datasets; if a given path is a directory all H5 files ('*.h5', '*.hdf', '*.hdf5', '*.hd5')
    # inside this this directory will be included as well (non-recursively)
    file_paths:
      - "/home/ros2_ws/src/capacitynet/config/calibration_data/03_02_2026_23_12_25_group_0.h5"





    # SliceBuilder configuration, i.e. how to iterate over the input volume patch-by-patch
    slice_builder:
      # SliceBuilder class
      name: SliceBuilder
      # train patch size given to the network (adapt to fit in your GPU mem, generally the bigger patch the better)
      patch_shape: [128, 128, 128]
      # train stride between patches
      stride_shape: [128, 128, 128]
      # halo around each patch
      halo_shape:  [0, 0, 0]



    transformer:
        raw:
          # apply min-max scaling and map the input to [-1, 1]
          - name: Normalize
          - name: ToTensor
            expand_dims: true

