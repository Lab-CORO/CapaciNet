
# --- configuration principale -------------------------------------------------
manual_seed: 42  # assure une reproductibilité
dataset:
  name: HDF5Dataset

model:
  name: UNet3D
  in_channels: 1
  out_channels: 1
  initial_feature_maps: 32
  final_sigmoid: true  # régression, pas de sigmoïde en sortie
  patch_size: [76, 76, 76]
  layer_order: gcr
  f_maps: [32, 64,128,256, 512]
  num_groups: 8


loss:
  name: BCEDiceLoss  # un bon compromis entre L1 et MSE

eval_metric:
  name: DiceCoefficient  # métrique plus pertinente pour la régression d’image

optimizer:
  learning_rate: 0.00005     # augmenté à 2e-4 pour redémarrer l'entraînement
  weight_decay: 0.00001     # keep as is

lr_scheduler:
  name: ReduceLROnPlateau
  mode: max                 # we want to maximize DiceCoefficient
  factor: 0.5               # reduce LR by half
  patience: 50              # wait 50 validations (3000 iterations) before reducing
  cooldown: 10              # wait a bit before resuming LR checks
  min_lr: 0.00000001          #

trainer:
  eval_score_higher_is_better: True
  checkpoint_dir: "/lustre06/project/6089348/willore/CapaciNet/unet_3d/data_finetune_002m/checkpoint"
  resume: "/lustre06/project/6089348/willore/CapaciNet/unet_3d/data_finetune_002m/checkpoint/last_checkpoint.pytorch"
  pre_trained: null
  validate_after_iters: 100
  log_after_iters: 100
  max_num_epochs: 500
  max_num_iterations: 2000000

loaders:
  num_workers: 1
  raw_internal_path: raw
  label_internal_path: label

  train:
    file_paths: ["/lustre06/project/6089348/willore/CapaciNet/unet_3d/data/train_augmented"]
    slice_builder:
      name: SliceBuilder
      patch_shape: [152, 152, 152]
      stride_shape: [152, 152, 152]
    transformer:
      raw:
        - name: Identity
        - name: ToTensor
          expand_dims: true
      label:
        - name: Identity
        - name: ToTensor
          expand_dims: true

  val:
    file_paths: ["/lustre06/project/6089348/willore/CapaciNet/unet_3d/data/val"]
    slice_builder:
      name: SliceBuilder
      patch_shape: [152, 152, 152]
      stride_shape: [152, 152, 152]
    transformer:
      raw:
        - name: Identity
        - name: ToTensor
          expand_dims: true
      label:
        - name: Identity
        - name: ToTensor
          expand_dims: true

train:
  epochs: 200
  batch_size: 1
