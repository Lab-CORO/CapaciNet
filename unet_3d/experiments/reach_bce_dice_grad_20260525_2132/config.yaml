manual_seed: 42

model:
  name: UNet3D
  in_channels: 1
  out_channels: 1
  final_sigmoid: false
  f_maps: [16, 32, 64, 128, 256]
  layer_order: gcr
  num_groups: 8

loss:
  name: BCEDiceGradientLoss
  gradient_weight: 0.1

eval_metric:
  name: DiceCoefficient

optimizer:
  learning_rate: 5.0e-05
  weight_decay: 1.0e-05

lr_scheduler:
  name: ReduceLROnPlateau
  mode: min
  factor: 0.5
  patience: 50
  cooldown: 10
  min_lr: 1.0e-08

trainer:
  eval_score_higher_is_better: true
  checkpoint_dir: "/workspace/unet_3d/experiments/reach_bce_dice_grad_20260525_2132/checkpoint"
  resume: null
  pre_trained: null
  validate_after_iters: 100
  log_after_iters: 100
  max_num_epochs: 500
  max_num_iterations: 2000000

loaders:
  num_workers: 1
  raw_internal_path: raw
  label_internal_path: label

  train:
    file_paths: ["/workspace/unet_3d/data_002/train"]
    slice_builder:
      name: SliceBuilder
      patch_shape: [128, 128, 128]
      stride_shape: [128, 128, 128]
    transformer:
      raw:
        - name: Normalize
        - name: ToTensor
          expand_dims: true
      label:
        - name: Identity
        - name: ToTensor
          expand_dims: true

  val:
    file_paths: ["/workspace/unet_3d/data_002/val"]
    slice_builder:
      name: SliceBuilder
      patch_shape: [128, 128, 128]
      stride_shape: [128, 128, 128]
    transformer:
      raw:
        - name: Normalize
        - name: ToTensor
          expand_dims: true
      label:
        - name: Identity
        - name: ToTensor
          expand_dims: true
