manual_seed: 42

model:
  name: ResidualUNet3D
  in_channels: 1
  out_channels: 1
  final_sigmoid: true
  f_maps: [32, 64, 128]
  layer_order: gcr
  num_groups: 8

loss:
  name: MSELoss

eval_metric:
  name: MSE

optimizer:
  learning_rate: 5.0e-05
  weight_decay: 1.0e-05

lr_scheduler:
  name: ReduceLROnPlateau
  mode: min
  factor: 0.5
  patience: 10
  cooldown: 5
  min_lr: 1.0e-08

trainer:
  eval_score_higher_is_better: false
  checkpoint_dir: "/workspace/unet_3d/experiments/test_mse_residual_unet3d_20260325_1126/checkpoint"
  resume: null
  pre_trained: null
  validate_after_iters: 20
  log_after_iters: 20
  max_num_epochs: 100
  max_num_iterations: 2000000

loaders:
  num_workers: 1
  raw_internal_path: raw
  label_internal_path: label

  train:
    file_paths: ["/workspace/unet_3d/experiments/data_008/data/train"]
    slice_builder:
      name: SliceBuilder
      patch_shape: [152, 152, 152]
      stride_shape: [152, 152, 152]
    transformer:
      raw:
        - name: Normalize
        - name: ToTensor
          expand_dims: true
      label:
        - name: Identity
        - name: ToTensor
          expand_dims: true

  val:
    file_paths: ["/workspace/unet_3d/experiments/data_008/data/val"]
    slice_builder:
      name: SliceBuilder
      patch_shape: [152, 152, 152]
      stride_shape: [152, 152, 152]
    transformer:
      raw:
        - name: Normalize
        - name: ToTensor
          expand_dims: true
      label:
        - name: Identity
        - name: ToTensor
          expand_dims: true
